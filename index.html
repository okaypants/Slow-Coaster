<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#c9f2e3">
<title>Slow Coaster</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slow Coaster">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16131f; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; box-sizing: border-box;
         padding: 6px 12px 12px 6px; background: #c9f2e3; transition: background 4s ease;
         font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif;
         touch-action: none; user-select: none; -webkit-user-select: none;
         -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #card { width: 100%; max-width: 460px; }
  #hud { position: absolute; left: 10px; right: 12px; top: 10px; z-index: 2; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  #hud .chip { font-size: 15px; padding: 5px 10px 6px; border-width: 2.5px; box-shadow: 2px 2px 0 var(--ink); }
  #hud .btn { width: 32px; height: 32px; padding: 0; pointer-events: auto; }
  #hud #marks { gap: 4px; padding: 6px 9px; }
  #hud #marks i { width: 7px; height: 7px; }
  #hud #pause span { width: 4px; height: 11px; }
  .chip { background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 999px;
          box-shadow: 3px 3px 0 var(--ink); font-weight: 700; font-size: 19px; line-height: 1;
          padding: 7px 14px 8px; min-width: 22px; text-align: center; box-sizing: border-box; }
  #marks { display: flex; gap: 5px; padding: 9px 12px; }
  #marks i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; transition: background .8s; }
  #marks i.on { background: #5fd6a8; }
  #marks.gold i { background: #ffd84d; }
  .right { display: flex; gap: 8px; align-items: center; }
  #mult { background: #ffe14d; transition: opacity .8s, transform .8s; }
  #mult.off { opacity: 0; transform: scale(.6); }
  .btn { appearance: none; -webkit-appearance: none; cursor: pointer; font: inherit; width: 42px; height: 42px; padding: 0;
         display: flex; align-items: center; justify-content: center; gap: 4px; touch-action: manipulation;
         transition: transform .1s, box-shadow .1s, opacity .8s; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  #pause span { width: 5px; height: 14px; background: var(--ink); border-radius: 2px; }
  #pause.off { opacity: 0; pointer-events: none; }
  #card { flex: 1; min-height: 0; position: relative; background: #000; border: 4px solid var(--ink); border-radius: 28px;
          box-shadow: 6px 6px 0 var(--ink); overflow: hidden; box-sizing: border-box; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  #ttl { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%) rotate(-3deg) scale(.8);
         background: #ffe14d; color: var(--ink); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--ink);
         padding: 8px 22px 12px; font-weight: 700; font-size: 34px; line-height: 1.05; white-space: nowrap; pointer-events: none;
         opacity: 0; transition: opacity 1.5s ease, transform 1.5s ease; }
  #ttl.on { opacity: 1; transform: translate(-50%, -50%) rotate(-3deg) scale(1); }
  #tools { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 18px;
           opacity: 0; pointer-events: none; transition: opacity 1s; }
  #tools.on { opacity: 1; pointer-events: auto; }
  #tools .btn { width: 48px; height: 48px; }
  #listen { background: #8fd3ff; }
  #wipe { background: #ffb3c7; }
  #wipe.arm { background: #ff6b6b; animation: wig .3s infinite alternate ease-in-out; }
  @keyframes wig { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  svg { display: block; }
</style>
</head>
<body>
<div id="card">
  <canvas id="c"></canvas>
  <div id="hud">
  <div class="chip" id="score">0</div>
  <div class="chip" id="marks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="right">
    <div class="chip off" id="mult">&times;1</div>
    <button class="chip btn off" id="pause" aria-label="Pause"><span></span><span></span></button>
  </div>
  </div>
  <div id="ttl">slow coaster</div>
  <div id="tools">
    <button class="chip btn" id="listen" aria-label="Listen">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#16131f" stroke-width="3.2" stroke-linecap="round"><path d="M4 9v4M9 5v12M14 8v6M19 10v2"/></svg>
    </button>
    <button class="chip btn" id="wipe" aria-label="Wipe tune">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#16131f" stroke-width="3.4" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </button>
  </div>
</div>
<script>
(() => {
'use strict';

// ---------- palette (16 colours, ABGR for little-endian pixel buffer) ----------
const C = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const BLACK = C(0,0,0), NAVY = C(0,0,128), GREEN = C(0,128,0), TEAL = C(0,128,128),
      MAROON = C(128,0,0), PURPLE = C(128,0,128), OLIVE = C(128,128,0), SILVER = C(192,192,192),
      GRAY = C(128,128,128), BLUE = C(0,0,255), LIME = C(0,255,0), CYAN = C(0,255,255),
      RED = C(255,0,0), MAGENTA = C(255,0,255), YELLOW = C(255,255,0), WHITE = C(255,255,255);
const BRIGHT = [RED, LIME, CYAN, MAGENTA, YELLOW, BLUE];
const DIM    = [MAROON, GREEN, TEAL, PURPLE, OLIVE, NAVY];

// ---------- screen ----------
const $ = id => document.getElementById(id);
const cv = $('c'), ttl = $('ttl'), card = $('card');
const ctx = cv.getContext('2d');
let W = 96, H = 200, S = 4, img, buf;
const TOP = 0; // the score and marks now live outside the canvas, so the whole card is the field

function resize() {
  const cw = card.clientWidth || 300, chh = card.clientHeight || 500;
  S = Math.max(2, Math.floor(cw / 96));
  W = Math.ceil(cw / S);
  H = Math.ceil(chh / S);
  cv.width = W; cv.height = H;
  cv.style.width = (W * S) + 'px';
  cv.style.height = (H * S) + 'px';
  img = ctx.createImageData(W, H);
  buf = new Uint32Array(img.data.buffer);
  ttl.style.fontSize = Math.round(Math.min(40, cw * 0.1)) + 'px';
}

// ---------- chunky drawing primitives ----------
function px(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; }
function rect(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y); w |= 0; h |= 0;
  let x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
  if (x < 0) x = 0; if (y < 0) y = 0;
  for (let j = y; j < y1; j++) { const o = j * W; for (let i = x; i < x1; i++) buf[o + i] = c; }
}
function line(x0, y0, x1, y1, c, th) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let n = 0; n < 2000; n++) {
    if (th > 1) rect(x0, y0, th, th, c); else px(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function disc(cx, cy, r, c) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (let j = -r; j <= r; j++) {
    const hw = Math.floor(Math.sqrt(r * r - j * j + r * 0.8));
    rect(cx - hw, cy + j, hw * 2 + 1, 1, c);
  }
}
function tri(cx, cy, r, c) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (let i = 0; i <= 2 * r; i++) { const hw = i >> 1; rect(cx - hw, cy - r + i, hw * 2 + 1, 1, c); }
}
function diamond(cx, cy, r, c) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (let i = -r; i <= r; i++) { const hw = r - Math.abs(i); rect(cx - hw, cy + i, hw * 2 + 1, 1, c); }
}

// ---------- 3x5 bitmap font ----------
const FONT = {};
(function () {
  const g = {
    A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
    E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
    I:'111010010010111', J:'001001001101010', K:'101101110101101', L:'100100100100111',
    M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
    Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
    U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
    Y:'101101010010010', Z:'111001010100111',
    0:'111101101101111', 1:'010110010010111', 2:'110001010100111', 3:'110001010001110',
    4:'101101111001001', 5:'111100110001110', 6:'011100111101111', 7:'111001010010010',
    8:'111101111101111', 9:'111101111001110',
    '.':'000000000000010', '!':'010010010000010', ':':'000010000010000', '-':'000000111000000',
    '+':'000010111010000', '?':'110001010000010', '/':'001001010100100', ' ':'000000000000000'
  };
  for (const k in g) FONT[k] = g[k];
})();
function text(s, x, y, c, sc) {
  sc = sc || 1; s = String(s);
  for (let n = 0; n < s.length; n++) {
    const g = FONT[s[n]] || FONT[' '];
    for (let i = 0; i < 15; i++) if (g[i] === '1') rect(x + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc, c);
    x += 4 * sc;
  }
}
const textW = (s, sc) => String(s).length * 4 * (sc || 1) - (sc || 1);
function ctext(s, y, c, sc) { text(s, Math.round((W - textW(s, sc)) / 2), y, c, sc); }

// ---------- plain controls ----------
let hits = [], wipeArm = 0;
function button(label, y, hot, bx, id) {
  const w = textW(label) + 12, x = bx === undefined ? Math.round((W - w) / 2) : bx, c = hot ? WHITE : GRAY;
  if (id) hits.push({ x: x - 2, y: y - 3, w: w + 4, h: 17, id });
  rect(x, y, w, 11, BLACK);
  rect(x, y, w, 1, c); rect(x, y + 10, w, 1, c); rect(x, y, 1, 11, c); rect(x + w - 1, y, 1, 11, c);
  text(label, x + 6, y + 3, hot ? WHITE : SILVER);
}

// ---------- sound (all synthesised) ----------
let ac = null, noiseBuf = null, master = null, send = null, padOsc = null, padGain = null, padPan = null;
function initAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      master = ac.createGain(); master.gain.value = 0.9;
      const comp = ac.createDynamicsCompressor();
      const warm = ac.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 1800;
      master.connect(warm); warm.connect(comp); comp.connect(ac.destination);
      send = ac.createGain(); send.gain.value = 0.5;       // echo bus
      const dl = ac.createDelay(2), fb = ac.createGain(); dlNode = dl;
      dl.delayTime.value = stepDur() * 3; fb.gain.value = 0.38;
      const dark = ac.createBiquadFilter(); dark.type = 'lowpass'; dark.frequency.value = 1800;   // each echo is duller than the last
      send.connect(dl); dl.connect(dark); dark.connect(fb); fb.connect(dl); dark.connect(master);
      // a long, soft hall: every sound blooms and hangs in the air
      const hall = ac.createConvolver(), wet = ac.createGain(), len = Math.floor(ac.sampleRate * 5);
      const ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const q = ir.getChannelData(c); for (let i = 0; i < len; i++) q[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      hall.buffer = ir; wet.gain.value = 0.55;
      send.connect(hall); dark.connect(hall); hall.connect(wet); wet.connect(master);
    }
    if (ac && !padOsc) {   // one continuous soft voice that follows the light: pitch from height, side from position, level from how close things are
      padOsc = ac.createOscillator(); padGain = ac.createGain(); padGain.gain.value = 0;
      padOsc.type = 'sine'; padOsc.frequency.value = 130; padOsc.connect(padGain);
      if (ac.createStereoPanner) { padPan = ac.createStereoPanner(); padGain.connect(padPan); padPan.connect(master); padPan.connect(send); }
      else { padGain.connect(master); padGain.connect(send); }
      padOsc.start();
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function beep(f, d, v, type, f2, delay) {
  if (!ac) return;
  try {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function noise(d, v) {
  if (!ac) return;
  try {
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = noiseBuf; g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    s.connect(g); g.connect(master); s.start(); s.stop(ac.currentTime + d);
  } catch (e) {}
}
// ---------- the character of the music: all of it comes from how you play ----------
// mode  (dark..bright)  <- how high on the screen you tend to fly
// rich  (3..7 tones)    <- how much of the space you roam
// bpm                   <- how fast you move
// key                   <- where the very first gem of a tune was grabbed
// drums                 <- gems write kicks, near-misses write hats, crashes and clears write snares
// timbre                <- the look of the nearest hazard; ring length <- how much room you had
// little runs           <- the direction and speed you were travelling when you grabbed the gem
const MODES = [[0,2,3,5,7,8,10], [0,2,3,5,7,9,10], [0,2,4,5,7,9,10], [0,2,4,5,7,9,11], [0,2,4,6,7,9,11]];
const MODE_NAMES = ['AEOLIAN', 'DORIAN', 'MIXOLYDIAN', 'IONIAN', 'LYDIAN'];
const KEYS = ['C', 'C+', 'D', 'D+', 'E', 'F', 'F+', 'G', 'G+', 'A', 'A+', 'B'];
// which scale tones arrive first as the scale fills out: the gentle five-note core, then the tenser tones
const PRI_MINOR = [0, 4, 2, 6, 3, 1, 5], PRI_MAJOR = [0, 4, 2, 1, 5, 6, 3];
const WAVES = ['sine', 'triangle', 'square', 'sawtooth'];
let ch = { mode: 2, rich: 5, bpm: 50 };
let eSpeed = 30, eX = 0.5, eY = 0.5, eVar = 0.02, velX = 0, velY = 0, lastPX = 0, lastPY = 0;
const stepDur = () => 60 / ch.bpm / 4;
function scaleNow() { const m = MODES[ch.mode]; return (ch.mode < 2 ? PRI_MINOR : PRI_MAJOR).slice(0, ch.rich).map(i => m[i]).sort((p, q) => p - q); }
function pitchIdx(idx, oct) {
  const sc = scaleNow(), R = sc.length; idx = Math.max(0, idx);
  return 130.81 * Math.pow(2, ((tune.root || 0) + sc[idx % R] + 12 * Math.floor(idx / R) + oct) / 12);
}
const pitch = (y, oct) => pitchIdx(Math.round((1 - y) * 2 * ch.rich), oct);   // y: 0 top .. 1 bottom

// ---------- the tune: every gem you grab becomes a note in a growing loop ----------
const OCT = [0, -12, 12, -12, -12, 12, 0];      // pluck, pad, glint, bass, and the ghost left by a crash
// every voice swells in slowly and takes seconds to fade
const ENV = [[0.4, 3.5, 0.045], [1.2, 5, 0.04], [0.3, 4, 0.026], [0.8, 4, 0.055], [1.5, 6, 0.04], [0.05, 5, 0.03], [2, 6, 0.045]];
const DEFW = [1, 0, 0, 0, 0, 1, 0];
// each instrument loops on a slightly different length, so the layers slide
// against each other and the piece never repeats quite the same way twice
const PH = [0, 2, 3, 6, 11, 5, 9];
const trackLen = k => tune.len + PH[k];
let tick = 0;
const MAX_LEN = 128, MAX_NOTES = 96;
let tune = { len: 16, notes: [], added: 0 };
try {
  const sv = JSON.parse(localStorage.getItem('saver.tune'));
  if (sv && Array.isArray(sv.notes) && sv.len) {
    tune = sv;
    if (sv.ch && sv.ch.bpm) { ch = sv.ch; ch.mode = Math.min(4, ch.mode); ch.bpm = Math.min(60, ch.bpm); ch.rich = Math.min(5, ch.rich); }
    tune.root = Math.min(6, tune.root || 0);
    while (tune.notes.length > 96) tune.notes.shift();
  }
} catch (e) {}
function saveTune() { tune.ch = ch; try { localStorage.setItem('saver.tune', JSON.stringify(tune)); } catch (e) {} }
function drums() {
  if (!tune.dr || !tune.dr.k) tune.dr = { k: new Array(16).fill(0), h: new Array(16).fill(0), s: new Array(16).fill(0) };
  return tune.dr;
}
function drumHit(which, even) {
  let st = tick % 16; if (even && st % 2) st = (st + 1) % 16;
  drums()[which][st] = 1;
}
let nextTime = 0, pulses = [], bounceCd = 0, dlNode = null;

function tone(f, type, tm, att, dec, vol, pan, lp) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, tm);
    g.gain.setValueAtTime(0.0001, tm);
    g.gain.linearRampToValueAtTime(vol, tm + att);
    g.gain.exponentialRampToValueAtTime(0.0008, tm + att + dec);
    let n = o;
    if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); n = fl; }
    n.connect(g);
    let out = g;
    if (pan && ac.createStereoPanner) { const sp = ac.createStereoPanner(); sp.pan.value = pan; g.connect(sp); out = sp; }
    out.connect(master); out.connect(send);
    o.start(tm); o.stop(tm + att + dec + 0.05);
  } catch (e) {}
}
function voice(nt, tm) {
  const e = ENV[nt.k], w = Math.min(1, nt.w === undefined ? DEFW[nt.k] : nt.w);   // only soft waves: sine or triangle
  const base = Math.round((1 - nt.y) * 2 * ch.rich);
  const open = nt.d === undefined ? 0.5 : nt.d;
  const dec = e[1] * (0.7 + open * 0.6), pan = nt.x * 1.6 - 0.8, f = pitchIdx(base, OCT[nt.k]);
  const att = e[0] * (0.6 + (nt.a === undefined ? 0.5 : 1 - nt.a) * 0.9);   // a slow approach swells in slowly, a quick one arrives sooner
  const twin = [1.004, 2.003, 1.498, 0.5, 1.004][((nt.kk || 0) / 6) | 0];   // each family of kinds adds its own overtone
  tone(f, WAVES[w], tm, att, dec, e[2], pan, w ? 900 : 0);
  tone(f * twin, 'sine', tm, att * 1.3, dec, e[2] * (twin > 1.01 || twin < 1 ? 0.3 : 0.5), -pan);
}
function kick(tm, v) {
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(90, tm); o.frequency.exponentialRampToValueAtTime(45, tm + 0.14);
    g.gain.setValueAtTime(0.09 * v, tm); g.gain.exponentialRampToValueAtTime(0.001, tm + 0.16);
    o.connect(g); g.connect(master); o.start(tm); o.stop(tm + 0.2);
  } catch (e) {}
}
function hiss(tm, v, len, type, freq) {
  try {
    const s = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
    s.buffer = noiseBuf; fl.type = type; fl.frequency.value = freq;
    g.gain.setValueAtTime(v, tm); g.gain.exponentialRampToValueAtTime(0.001, tm + len);
    s.connect(fl); fl.connect(g); g.connect(master); g.connect(send); s.start(tm); s.stop(tm + len + 0.01);
  } catch (e) {}
}
function playStep(st, tm) {
  for (const nt of tune.notes) if (st % trackLen(nt.k) === nt.s && Math.random() < 0.6) {   // notes rest often, so the texture keeps thinning and refilling
    voice(nt, tm);
    pulses.push({ x: nt.x, y: nt.y, k: nt.k, life: 1.6 });
  }
  // the beat is whatever your gems, near-misses and crashes have written; it fades unless you keep feeding it
  const d = drums(), q = st % 16;
  if (q === 15 && state === 'play') for (const key of ['k', 'h', 's']) for (let i = 0; i < 16; i++) d[key][i] *= 0.93;
  if (q === 0 && tune.notes.length && ((st / 16) | 0) % 2 === 0) {   // a quiet drone on the key note holds everything together
    const f = pitchIdx(0, -12), len = stepDur() * 30;
